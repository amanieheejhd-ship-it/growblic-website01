name: GitHub Pages deployment (manual only)

# Publishing remains manual until the public NestJS API is deployed and verified.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Build workspace libraries
        # apps/web and submissions-service import buildable workspace packages
        # (@growblic/contracts, @growblic/validation, @growblic/nest-common, …)
        # whose dist/ is produced by their Nx `build` target. The gate and export
        # steps below use `pnpm --filter …`, which BYPASSES Nx's `^build`
        # dependency graph — so on a fresh CI checkout those dist/ folders are
        # missing and typecheck/build fail with
        # "Cannot find module '@growblic/contracts'". Build the libs first, via
        # Nx (which resolves inter-lib build order).
        run: pnpm exec nx run-many -t build --projects=tag:scope:shared,tag:scope:service-lib
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Validate submissions
        run: |
          pnpm --filter @growblic/web typecheck
          pnpm --filter @growblic/submissions-service typecheck
          pnpm test:website-submissions

      - name: Build static site
        run: pnpm build:pages
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Growblic API gateway — exposes the microservices behind one public origin
# so the frontends can keep a single NEXT_PUBLIC_API_URL.
#
# Route map:
#   /public-submissions/*  -> submissions-service (4001)
#   /public-auth/*         -> accounts-service    (4004)  (public user login)
#   /admin/*               -> admin-service       (4002)
#   everything else        -> internship-service  (4000)  (portal, payments, health)
#   /internal/*            -> blocked (service-to-service only, never public)
#     incl. /internal/public-user-identity (accounts-service, SSO bridge) and
#     /internal/internship-certificates/* (internship-service) — token-gated.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream submissions_service {
    server submissions-service:4001;
  }

  upstream accounts_service {
    server accounts-service:4004;
  }

  upstream admin_service {
    server admin-service:4002;
  }

  upstream internship_service {
    server internship-service:4000;
  }

  server {
    listen 8080;

    # Never expose the token-guarded internal API through the public gateway.
    location /internal/ {
      return 403;
    }

    location /public-submissions/ {
      proxy_pass http://submissions_service;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /public-auth/ {
      proxy_pass http://accounts_service;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
      proxy_pass http://admin_service;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://internship_service;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
